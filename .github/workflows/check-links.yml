name: Check for Broken Links

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Check links
        id: check
        run: |
          node << 'EOF'
          const fs = require('fs');
          const https = require('https');
          const http = require('http');

          function findMdxFiles(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = `${dir}/${entry.name}`;
              return entry.isDirectory() ? findMdxFiles(full) : full.endsWith('.mdx') ? [full] : [];
            });
          }

          const urlRegex = /https?:\/\/[^\s\)\]\}"'>]+/g;
          const skip = [/YOURUSERNAME/, /example\.com/, /placeholder/];
          const urls = new Map();

          for (const file of findMdxFiles('src/content')) {
            for (const match of fs.readFileSync(file, 'utf-8').matchAll(urlRegex)) {
              const url = match[0].replace(/[)\]\}.,;:!?"'>]+$/, '');
              if (skip.some(p => p.test(url))) continue;
              if (!urls.has(url)) urls.set(url, []);
              urls.get(url).push(file.replace('src/content/', ''));
            }
          }

          const request = (url, method) => new Promise(resolve => {
            const lib = url.startsWith('https') ? https : http;
            const { hostname, pathname, search } = new URL(url);
            const req = lib.request(
              { hostname, path: pathname + search, method, timeout: 10000,
                headers: { 'User-Agent': 'Mozilla/5.0 Chrome/120.0.0.0' } },
              res => { res.resume(); resolve(res.statusCode); }
            );
            req.on('timeout', () => { req.destroy(); resolve('TIMEOUT'); });
            req.on('error', () => resolve('ERROR'));
            req.end();
          });

          const broken = [];
          let i = 0;
          (async () => {
            for (const [url, files] of urls) {
              let status = await request(url, 'HEAD');
              if ([403, 405, 503].includes(status)) status = await request(url, 'GET');
              if (status === 'ERROR' || status === 'TIMEOUT' || status >= 400) {
                broken.push({ url, status, files });
              }
              process.stdout.write(`\r${++i}/${urls.size} checked`);
            }

            console.log(`\n\nFound ${broken.length} broken links.`);
            if (broken.length > 0) {
              broken.forEach(({ url, status, files }) =>
                console.log(`\n❌ [${status}] ${url}\n   in: ${files.join(', ')}`)
              );
              fs.writeFileSync('broken-links.json', JSON.stringify(broken, null, 2));
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'broken_found=true\n');
            }
          })();
          EOF

      - name: Open issue for broken links
        if: steps.check.outputs.broken_found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The weekly link checker found broken URLs in \`src/content/\`. Open each in a browser to confirm — 403s are often false positives from scraper-blocking sites.\n\n"
          body+=$(node -e '
            const links = require("./broken-links.json");
            links.forEach(({ url, status, files }) =>
              console.log(`**❌ [${status}] ${url}**\nFound in: ${files.join(", ")}\n`)
            );
          ')
          gh label create "broken-links" --color "d73a4a" --force 2>/dev/null || true
          gh issue create \
            --title "🔗 Broken links detected" \
            --body "$body" \
            --label "broken-links"
